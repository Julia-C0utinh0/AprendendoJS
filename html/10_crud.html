<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel administrativo</title>
</head>
<body>

<h1>Crud</h1>
<p> Create (inserir)</p>
<p> Read (buscar)</p>
<p> Update (alterar)</p>
<p> Delete (remover)</p>

<hr/>

<input id="fagundes" placeholder="Digite seu besouro">
<button onclick="inserir()">Salvar</button>

<button style="display:none;">Salvar alterações</button>

<ul id="listabeso">    
</ul>

<script>
//Dados mockados

let besouro = ["Dynastes","Cassidinae","Cerambycidae"] //Array ou vetor

buscartud()

function buscartud(){
    let html=""

    besouro.map(i => html += `<li> ${i} <button onclick='atualizar("${i}")'>🖊</button> <button onclick='remover("${i}")'>❌</button> </li>`)    
    
    document.getElementById("listabeso").innerHTML=html
}

function inserir(){
    let novoBesouro = document.getElementById("fagundes").value


    // Exemplo de uso dentro da função inserir():
if (besouro.includes(novoBesouro)) {
    alert("Este besouro já está na lista!")
    return
}

    if(novoBesouro.trim().length < 3){
        alert("NENHUM NOME DE BESOURO TEM MENOS DE 3 LETRAS")
        return
    }

    if(novoBesouro == "invalido"){
        alert("Tente de novo....vai....")
        return
    }

    besouro = besouro.concat(novoBesouro)
    console.log(besouro)
    buscartud()
    
    document.getElementById("fagundes").value = ""
}

function remover(nomeBesouro){
    let resposta = confirm("Tem certeza que deseja remover?")
    if (resposta == false){
        return
    }
    
    besouro = besouro.filter(item => item !== nomeBesouro)
    buscartud()
}
</script>
</body>
</html>















</script>
