  <!-- ======================================================
       TELA 1: INTRODUÇÃO
       Aqui contamos a história aos poucos e pedimos o nome
       de quem está jogando (o Espírito das Flores).
  ======================================================= -->
  <div id="tela-intro" class="tela">

    <svg class="ilustracao" viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <!-- chão rachado -->
      <path d="M0 190 L320 190 L320 220 L0 220 Z" fill="#211a16"/>
      <path d="M40 190 L55 178 L70 190" stroke="#3a2e26" stroke-width="3" fill="none"/>
      <path d="M180 190 L200 176 L215 190" stroke="#3a2e26" stroke-width="3" fill="none"/>

      <!-- engrenagens enferrujadas, restos das máquinas -->
      <circle cx="70" cy="150" r="34" fill="none" stroke="#6b4a3a" stroke-width="10" opacity="0.55"/>
      <circle cx="70" cy="150" r="10" fill="#6b4a3a" opacity="0.55"/>
      <circle cx="250" cy="120" r="24" fill="none" stroke="#4a382c" stroke-width="8" opacity="0.5"/>

      <!-- sol suave -->
      <circle cx="255" cy="45" r="26" fill="#eab923" opacity="0.85"/>
      <circle cx="255" cy="45" r="40" fill="#eab923" opacity="0.18"/>

      <!-- o broto de flor nascendo -->
      <path d="M158 190 C158 150 158 130 158 110" stroke="#4f7942" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M158 150 C140 145 130 130 132 118" stroke="#4f7942" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M158 165 C176 160 186 148 184 136" stroke="#4f7942" stroke-width="4" fill="none" stroke-linecap="round"/>
      <g transform="translate(158,105)">
        <circle r="7" fill="#eab923"/>
        <circle cx="-11" cy="-3" r="6" fill="#e2725b"/>
        <circle cx="11" cy="-3" r="6" fill="#e2725b"/>
        <circle cx="-7" cy="9" r="6" fill="#e2725b"/>
        <circle cx="7" cy="9" r="6" fill="#e2725b"/>
      </g>
    </svg>

    <div id="passo-historia" class="cartao-historia">
      <p id="texto-historia" class="texto-historia"></p>
      <button id="botao-continuar" class="botao botao-principal">Continuar</button>
    </div>

    <!-- Formulário de nome: começa escondido, aparece depois da história -->
    <form id="form-nome" class="cartao-historia escondido">
      <p class="texto-historia">Antes de entrarmos no jardim... como as flores devem te chamar?</p>
      <input id="input-nome" type="text" maxlength="18" placeholder="Seu nome" autocomplete="off" required>
      <button type="submit" class="botao botao-principal">Confirmar</button>
    </form>

    <!-- Boas-vindas final: também começa escondida -->
    <div id="boas-vindas" class="cartao-historia escondido">
      <p id="texto-boas-vindas" class="texto-historia"></p>
      <button id="botao-entrar" class="botao botao-principal">Entrar no jardim</button>
    </div>
  </div>

  <!-- ======================================================
       TELA 2: O JARDIM (o jogo em si)
  ======================================================= -->
  <div id="tela-jogo" class="tela escondido">

    <header class="cabecalho">
      <h1>Pequena Fleur <span class="til">~</span></h1>
      <p class="subtitulo">O mundo esqueceu as flores. Você vai ajudar Fleur a lembrá-lo.</p>

      <button id="botao-sol" class="botao-sol" title="Toque para reunir energia do sol">
        <span class="sol-emoji">🔆</span>
      </button>
      <p class="contador-sol">Raios de sol: <strong id="txt-sol">0</strong></p>
      <p class="contador-flores">Flores devolvidas ao mundo: <strong id="txt-flores">0</strong></p>
    </header>

    <!-- Fala da Fleur: aparece e muda conforme o jogo avança -->
    <div class="fala-fleur">
      <p class="fala-autor">Fleur diz:</p>
      <p id="texto-fleur" class="fala-texto">...</p>
    </div>

    <main class="jardim">
      <!-- Os canteiros (plots) são criados pelo JavaScript, veja script.js -->
      <div id="canteiros" class="canteiros"></div>
    </main>

    <section class="loja">
      <h2>Sementes disponíveis</h2>
      <p class="loja-dica">Toque numa semente para plantá-la no primeiro canteiro livre.</p>
      <div id="lista-sementes" class="lista-sementes"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
